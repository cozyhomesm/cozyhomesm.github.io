  var a=document.createElement('a');a.className='hs';a.href=p.url;a.target='_blank';a.rel='noopener';
  a.style.left=p.x+'%';a.style.top=p.y+'%';a.style.setProperty('--d',(j*0.4)+'s');
  if(/^#[0-9a-f]{6}$/i.test(p.color||''))a.style.setProperty('--accent',p.color);
  var direct=(p.mode||D.mode)==='direct';
  a.setAttribute('aria-label',p.name||'Ver produto');
  a.innerHTML='<span class="dot"></span>';
  a.addEventListener('click',function(e){hideHint();if(!direct){e.preventDefault();openSheet(p,s.src)}});
  st.appendChild(a);
 });
 sl.appendChild(st);track.appendChild(sl);
 if(N>1&&N<=15){var dt=document.createElement('i');dotsEl.appendChild(dt);dots.push(dt)}
});
var thDone={};
function preThumbs(i){var s=D.slides[i];if(!s)return;s.points.forEach(function(p){if(p.th&&!thDone[p.th]){thDone[p.th]=1;new Image().src=p.th}})}
function loadSlide(i){var b=slidesEl[i];if(b&&!b.done){b.img.src=b.src;b.bg.style.backgroundImage='url("'+b.src+'")';b.done=true}}
function update(i){
 if(i===cur)return;cur=i;
 counter.textContent=(i+1)+' / '+N;
 dots.forEach(function(d,k){d.className=k===i?'on':''});
 loadSlide(i);loadSlide(i+1);loadSlide(i-1);preThumbs(i);
 $('prev').disabled=i===0;$('next').disabled=i===N-1;
 var s=D.slides[i];
 document.title=s&&s.name?s.name+(D.title?' · '+D.title:''):homeTitle;
 if(canUrl&&!booting){try{history.replaceState({v:homeBelow?1:0,i:i},'',slideUrl(i))}catch(e){}}
}
function setTheme(c){if(tc)tc.setAttribute('content',c)}
var hintShown=false;
function openViewer(i,push){
 i=Math.max(0,Math.min(N-1,i|0));
 viewerOpen=true;booting=true;
 viewer.classList.add('on');viewer.setAttribute('aria-hidden','false');home.setAttribute('aria-hidden','true');
 cur=-1;update(i);
 track.scrollLeft=i*track.clientWidth;
 requestAnimationFrame(function(){track.scrollLeft=i*track.clientWidth});
 clearTimeout(bootT);bootT=setTimeout(function(){booting=false},450);
 if(canUrl&&push){homeBelow=true;try{history.pushState({v:1,i:i},'',slideUrl(i))}catch(e){}}
 setTheme('#000000');
 if(!hintShown){hintShown=true;var hasPts=D.slides.some(function(s){return s.points.length});
  var msg=hasPts?'Toque nos pontos para ver os produtos':'';if(N>1)msg+=(msg?' · ':'')+'deslize →';
  if(msg){hint.textContent=msg;hint.classList.remove('off');setTimeout(hideHint,5000)}}
 armIdle();
}
function closeViewer(){
 if(!viewerOpen)return;viewerOpen=false;
 closeSheet();clearTimeout(idleT);hideSwipe();hideHint();
 viewer.classList.remove('on');viewer.setAttribute('aria-hidden','true');home.removeAttribute('aria-hidden');
 document.title=homeTitle;setTheme('#f7ece1');
 var t=tiles[cur];if(t){var r=t.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)t.scrollIntoView({block:'center'})}
}
// voltar: se a grade está logo atrás no histórico, usa o voltar do navegador; senão mostra a grade aqui mesmo
function goHome(){
 if(canUrl&&homeBelow){history.back();return}
 closeViewer();
 if(canUrl){try{history.replaceState(null,'',ROOT)}catch(e){}}
}
$('back').onclick=goHome;
window.addEventListener('popstate',function(){
 var st=history.state;
 if(st&&typeof st.i==='number'){homeBelow=!!st.v;openViewer(st.i,false)}
 else{homeBelow=false;closeViewer()}
});
function shareUrl(){
 var s=D.slides[cur];
 if(D.site)return s&&s.slug?D.site+s.slug+'/':D.site;
 return location.href;
}
$('share').onclick=function(){
 var u=shareUrl(),s=D.slides[cur],t=s&&s.name?s.name+(D.title?' · '+D.title:''):(D.title||'');
 if(navigator.share){navigator.share({title:t,url:u}).catch(function(){});return}
 function done(){hint.textContent='Link copiado!';hint.classList.remove('off');setTimeout(hideHint,2000)}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,function(){prompt('Copie o link:',u)});
 else prompt('Copie o link:',u);
};
if(N<2)counter.hidden=true;
var ticking=false;
track.addEventListener('scroll',function(){
 if(ticking)return;ticking=true;
 requestAnimationFrame(function(){ticking=false;var i=Math.round(track.scrollLeft/track.clientWidth);if(i!==cur){update(i);if(!booting)hideHint()}});
},{passive:true});
function go(i){i=Math.max(0,Math.min(N-1,i));track.scrollTo({left:i*track.clientWidth,behavior:'smooth'})}
$('prev').onclick=function(){go(cur-1)};$('next').onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){
 if(!viewerOpen)return;
 if(e.key==='Escape'){if(sheet.classList.contains('open'))closeSheet();else goHome();return}
 if(sheet.classList.contains('open'))return;
 if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
});
window.addEventListener('resize',function(){if(viewerOpen)track.scrollLeft=cur*track.clientWidth});
function hideHint(){hint.classList.add('off')}
function openSheet(p,src){
 $('sname').textContent=p.name||'Produto em destaque';
 var pr=$('sprice');pr.textContent=p.price||'';pr.hidden=!p.price;
 var th=$('sthumb');
 if(p.th){th.style.backgroundImage='url("'+p.th+'")';th.style.backgroundSize='cover';th.style.backgroundPosition='center'}
 else{th.style.backgroundImage='url("'+src+'")';th.style.backgroundSize='';th.style.backgroundPosition=p.x+'% '+p.y+'%'}
 $('scta').href=p.url;
 sheet.classList.add('open');backdrop.classList.add('open');sheet.setAttribute('aria-hidden','false');
}
function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open');sheet.setAttribute('aria-hidden','true')}
backdrop.onclick=closeSheet;$('sclose').onclick=closeSheet;
$('scta').addEventListener('click',function(){setTimeout(closeSheet,400)});
var y0=null;
sheet.addEventListener('touchstart',function(e){y0=e.touches[0].clientY},{passive:true});
sheet.addEventListener('touchend',function(e){if(y0!==null&&e.changedTouches[0].clientY-y0>60)closeSheet();y0=null});
var swipeEl=$('swipe'),idleT=null,IDLE=6000,SHOW=3500;
function hideSwipe(){swipeEl.classList.remove('on')}
function armIdle(){
 clearTimeout(idleT);hideSwipe();
 if(N<2||!viewerOpen)return;
 idleT=setTimeout(function(){
  if(viewerOpen&&cur<N-1&&!sheet.classList.contains('open')&&!document.hidden){
   hideHint();swipeEl.classList.add('on');
   idleT=setTimeout(armIdle,SHOW);
  }else armIdle();
 },IDLE);
}
['touchstart','pointerdown','wheel','keydown'].forEach(function(t){document.addEventListener(t,armIdle,{passive:true})});
track.addEventListener('scroll',armIdle,{passive:true});
// início: link de um cantinho abre direto nele; o endereço principal abre a grade
var st0=canUrl?history.state:null,start=bySlug(wanted());
if(start<0&&st0&&typeof st0.i==='number')start=st0.i;   // recarregou a página com um cantinho sem nome aberto
if(start>=0){
 homeBelow=!!(st0&&st0.v);
 openViewer(start,false);
 // chegou pelo link do cantinho: coloca a grade "atrás" no histórico no primeiro toque,
 // para o voltar do celular levar à grade em vez de sair do site
 if(canUrl&&!homeBelow){
  var ev=['pointerup','touchend','keydown'];
  var addHome=function(){
   ev.forEach(function(t){document.removeEventListener(t,addHome,true)});
   if(!viewerOpen||homeBelow)return;
   try{history.replaceState(null,'',ROOT);history.pushState({v:1,i:cur},'',slideUrl(cur));homeBelow=true}catch(e){}
  };
  ev.forEach(function(t){document.addEventListener(t,addHome,true)});
 }
}else{
 booting=false;
 if(canUrl&&location.hash){try{history.replaceState(null,'',ROOT)}catch(e){}}
}
})();
</script>
